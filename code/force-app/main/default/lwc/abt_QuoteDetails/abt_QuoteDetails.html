<template>
    <div class="quote-page">
        <div class="quote-detail-content">

            <template if:true={isLoading}>
                <div class="quote-loading">
                    <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                </div>
            </template>

            <template if:false={isLoading}>
                <div class="quote-detail-loaded">
                    <div class="quote-header">
                        <div class="quote-title-row">
                            <h2 class="quote-title">{pageTitle}</h2>
                            <template if:true={showStatusBadge}>
                                <span class={statusBadgeClass}>{statusLabel}</span>
                            </template>
                        </div>
                    </div>

                    <!-- Tabs row + packaging/actions; instruction sits below the tab divider -->
                    <div class="quote-detail-header-band">
                        <div class="quote-detail-tabs-row">
                            <div class="quote-detail-tabs" role="tablist">
                                <button type="button" class={sequencesTabClass} role="tab"
                                    aria-selected={isSequencesTab} onclick={handleSequencesTab}>Sequences</button>
                                <button type="button" class={deliveryTabClass} role="tab" aria-selected={isDeliveryTab}
                                    onclick={handleDeliveryTab}>Delivery Details</button>
                            </div>
                            <div class={headerBulkSlotClass}>
                                <template if:true={isSequencesTab}>
                                    <template if:true={showBulkSequenceActions}>
                                        <div class="step3-bulk-controls step3-bulk-controls--header">
                                            <div class="step3-bulk-field step3-bulk-field--toxic">
                                                <span class="step3-bulk-label">Toxic?</span>
                                                <div class="step3-bulk-control-row">
                                                    <input type="checkbox" class="step3-bulk-checkbox"
                                                        checked={bulkToxicChecked} disabled={isBulkToxicDisabled}
                                                        onchange={handleBulkToxicChange} />
                                                </div>
                                            </div>
                                            <template if:true={showBulkReflexSelection}>
                                                <div class="step3-bulk-field step3-bulk-field--reflex">
                                                    <span class="step3-bulk-label">Reflex?</span>
                                                    <div class="step3-bulk-control-row">
                                                        <input type="checkbox" class="step3-bulk-checkbox"
                                                            checked={bulkReflexChecked} disabled={isBulkReflexDisabled}
                                                            onchange={handleBulkReflexChange} />
                                                    </div>
                                                </div>
                                            </template>
                                            <template if:true={showVectorBulkSelection}>
                                                <div class="step3-bulk-field step3-bulk-field--vector">
                                                    <span class="step3-bulk-label">Vector</span>
                                                    <div class="step3-vector-cell step3-bulk-vector-cell"
                                                        onclick={stopProp}>
                                                        <c-abt-custom-select
                                                            class="step3-inline-select step3-vector-select step3-bulk-vector-select"
                                                            size="sm" name="bulk-vector" placeholder="Default vector"
                                                            options={vectorOptions} value={bulkVectorValue}
                                                            disabled={isBulkVectorDisabled}
                                                            onchange={handleBulkVectorChange}></c-abt-custom-select>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                    <template if:true={showAddSequenceButton}>
                                        <button type="button" class="footer-btn-next step3-add-sequence-btn"
                                            onclick={handleAddSequence}>+ Add Sequence</button>
                                    </template>
                                </template>
                                <template if:true={isDeliveryTab}>
                                    <template if:true={showGlycerolBulkActions}>
                                        <div class="step3-bulk-field step3-bulk-field--glycerol">
                                            <span class="step3-bulk-label">Glycerol Stock?</span>
                                            <div class="step3-bulk-control-row">
                                                <input type="checkbox" class="step3-bulk-checkbox"
                                                    checked={bulkGlycerolChecked} disabled={isGlycerolBulkDisabled}
                                                    onchange={handleBulkGlycerolChange} />
                                            </div>
                                        </div>
                                    </template>
                                    <template if:false={showGlycerolBulkActions}>
                                        <span class="step4-packaging-label">PACKAGING TYPE</span>
                                        <div class="step4-packaging-select-wrap">
                                            <c-abt-custom-select class="step4-packaging-select" name="packaging"
                                                size="md" fit-content placeholder={packagingPlaceholder}
                                                options={packagingOptions} value={packagingType} disabled={isReadOnly}
                                                onchange={handlePackagingChange}></c-abt-custom-select>
                                        </div>
                                    </template>
                                </template>
                            </div>
                        </div>
                        <div class="quote-detail-below-tabs">
                            <p class="step3-subtitle quote-detail-instruction">{instructionText}</p>
                            <template if:true={showCalculationStatus}>
                                <div class="quote-calculation-status" role="status">
                                    <template if:true={isCalculationPending}>
                                        <span class="quote-calculation-status-pending">
                                            <template if:true={showFeasibilityGameLink}>
                                                <a href="javascript:void(0);"
                                                    class="game-trigger-link game-trigger-link-bold"
                                                    onclick={handleGameLinkClick}
                                                    title="Play Helix Rush while you wait">
                                                    How about a game while you wait?
                                                </a>
                                                <span class="game-trigger-separator" aria-hidden="true">|</span>
                                            </template>
                                            {calculationPendingLabel}
                                            <span class="dot-loading" aria-hidden="true">
                                                <span class="dot dot1"></span>
                                                <span class="dot dot2"></span>
                                                <span class="dot dot3"></span>
                                            </span>
                                        </span>
                                    </template>
                                    <template if:true={showClassificationComplete}>
                                        <span class="quote-calculation-status-complete">
                                            <lightning-icon icon-name="utility:check" size="x-small"
                                                alternative-text="Complete"
                                                class="quote-calculation-check"></lightning-icon>
                                            Sequence Classification &amp; Pricing Complete
                                        </span>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- ─── SEQUENCES TAB ─────────────────────────────────────────────── -->
                    <template if:true={isSequencesTab}>
                        <div class="quote-body step3-body">
                            <template if:true={hasSequenceErrors}>
                                <div class="sequence-error-banner">
                                    <lightning-icon icon-name="utility:error" size="x-small" alternative-text="Error"
                                        variant="inverse"></lightning-icon>
                                    <span class="error-banner-text">
                                        <b>Error:</b> {sequenceErrorBannerMessage}
                                    </span>
                                </div>
                            </template>
                            <template if:true={hasDuplicateSequenceNames}>
                                <div class="sequence-error-banner">
                                    <lightning-icon icon-name="utility:error" size="x-small" alternative-text="Error"
                                        variant="inverse"></lightning-icon>
                                    <span class="error-banner-text">
                                        <b>Error:</b> {duplicateSequenceNameBannerMessage}
                                    </span>
                                </div>
                            </template>
                            <template if:true={hasSequenceNameErrors}>
                                <div class="sequence-error-banner">
                                    <lightning-icon icon-name="utility:error" size="x-small" alternative-text="Error"
                                        variant="inverse"></lightning-icon>
                                    <span class="error-banner-text">
                                        <b>Error:</b> {sequenceNameErrorBannerMessage}
                                    </span>
                                </div>
                            </template>
                            <template if:true={hasVectorErrors}>
                                <div class="sequence-error-banner">
                                    <lightning-icon icon-name="utility:error" size="x-small" alternative-text="Error"
                                        variant="inverse"></lightning-icon>
                                    <span class="error-banner-text">
                                        <b>Error:</b> {sequenceVectorErrorBannerMessage}
                                    </span>
                                </div>
                            </template>

                            <div class={step3TableWrapClass}>
                                <table class={step3TableClass}>
                                    <thead>
                                        <tr>
                                            <th class="step3-th step3-th-check">
                                                <input type="checkbox" checked={allSequencesSelected} onclick={stopProp}
                                                    onchange={handleSelectAll} disabled={isReadOnly} />
                                            </th>
                                            <th class="step3-th step3-th-name">Name</th>
                                            <th class="step3-th step3-th-seq">Sequence</th>
                                            <th class="step3-th step3-th-num">Length (bp)</th>
                                            <template if:true={showVectorSelection}>
                                                <th class="step3-th step3-th-vector step3-th-tooltip">
                                                    <span class="step3-th-vector-header">
                                                        <span class="step3-th-vector-label">Vector</span>
                                                        <template if:true={hasAnyReflexApplicableVector}>
                                                            <span
                                                                class="quote-th-tooltip-wrap step3-reflex-header-tooltip"
                                                                tabindex="0">
                                                                <span class="quote-th-reflex-warning-badge">
                                                                    <lightning-icon icon-name="utility:warning"
                                                                        size="x-small"
                                                                        alternative-text="Reflex w/ pStable"
                                                                        class="quote-th-tooltip-warning-icon quote-th-tooltip-warning-icon--header"></lightning-icon>
                                                                </span>
                                                                <span
                                                                    class="quote-th-tooltip-popover quote-th-tooltip-popover--wide step3-reflex-tooltip-popover"
                                                                    role="tooltip">
                                                                    <span class="quote-th-tooltip-arrow"
                                                                        aria-hidden="true"></span>
                                                                    <span class="quote-th-tooltip-body">
                                                                        <p>Sequences that cannot be stably propagated in
                                                                            pANSA or pUC vectors can often be
                                                                            successfully
                                                                            propagated using our inducible-copy
                                                                            pStable-Ind
                                                                            vector.</p>
                                                                        <p>Like pANSA and pUC, pStable-Ind is a cloning
                                                                            vector that is compatible with Golden Gate
                                                                            Assembly and many other applications.
                                                                            However, the pStable-Ind backbone is ~10.5
                                                                            kb, so please keep that in mind in case your
                                                                            application requires a compact plasmid.</p>
                                                                        <p>If you would like us to reflex into our
                                                                            inducible-copy pStable-Ind vector if our
                                                                            attempts in pANSA and pUC fail, please click
                                                                            on the plasmid map icon and check the Reflex
                                                                            Vector Opt-In checkbox.</p>
                                                                    </span>
                                                                </span>
                                                            </span>
                                                        </template>
                                                    </span>
                                                </th>
                                            </template>
                                            <th class="step3-th step3-th-feasibility step3-th-tooltip">
                                                <span class="quote-th-tooltip-wrap" tabindex="0">
                                                    <span class="quote-th-tooltip-label">Feasibility</span>
                                                    <span class="quote-th-tooltip-popover" role="tooltip">
                                                        <span class="quote-th-tooltip-arrow" aria-hidden="true"></span>
                                                        <span class="quote-th-tooltip-body">
                                                            <p><strong>Guaranteed:</strong> We are confident we can
                                                                synthesize your
                                                                sequence and are guaranteed to ship by the communicated
                                                                date or its
                                                                free.</p>
                                                            <p><strong>Accepted:</strong> We are confident we can
                                                                synthesize your sequence. These sequences are not
                                                                covered by the Ansa On-Time Guarantee.</p>
                                                            <p><strong>Let's try:</strong> Your sequence is slightly
                                                                outside our
                                                                standard product range or may be on the cutting edge of
                                                                what can be
                                                                synthesized, but we want to give it a try!</p>
                                                            <p><strong>Not currently possible:</strong> Your sequence is
                                                                outside
                                                                Ansa's current capabilities and cannot be accepted at
                                                                this time.</p>
                                                        </span>
                                                    </span>
                                                </span>
                                            </th>
                                            <th class="step3-th step3-th-toxic step3-th-tooltip">
                                                <c-abt-table-header-tooltip label="Potentially Toxic">
                                                    <p>Potentially toxic sequences can be difficult to manufacture. To
                                                        improve success rates, we strongly recommend enabling reflex
                                                        with the pStable vector when applicable. If visible, click the
                                                        vector map icon and check the box to enable the pStable reflex
                                                        option.</p>
                                                </c-abt-table-header-tooltip>
                                            </th>
                                            <th class="step3-th step3-th-icon"></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={sequencesWithDisplay} for:item="seq">
                                                <tr key={seq.id} class={seq.rowClass} data-id={seq.id}
                                                    onclick={handleRowClick}>
                                                    <td class="step3-td step3-td-check" onclick={stopProp}>
                                                        <input type="checkbox" data-id={seq.id} checked={seq.selected}
                                                            onchange={handleCheckboxClick} disabled={isReadOnly} />
                                                    </td>
                                                    <td class="step3-td step3-td-name">
                                                        <div class="step3-name-cell">
                                                            <template if:true={seq.hasInvalidChars}>
                                                                <lightning-icon icon-name="utility:warning"
                                                                    size="x-small" alternative-text="Warning"
                                                                    class="sequence-warning-icon"></lightning-icon>
                                                            </template>
                                                            <template if:true={seq.hasDuplicateName}>
                                                                <lightning-icon icon-name="utility:warning"
                                                                    size="x-small" alternative-text="Warning"
                                                                    class="sequence-warning-icon"></lightning-icon>
                                                            </template>
                                                            <template if:true={seq.hasInvalidName}>
                                                                <lightning-icon icon-name="utility:warning"
                                                                    size="x-small" alternative-text="Warning"
                                                                    class="sequence-warning-icon"></lightning-icon>
                                                            </template>
                                                            <span class="step3-name-text"
                                                                title={seq.nameTooltip}>{seq.name}</span>
                                                        </div>
                                                    </td>
                                                    <td class="step3-td step3-td-seq">{seq.sequenceTruncated}</td>
                                                    <td class="step3-td step3-td-num">{seq.length}</td>
                                                    <template if:true={showVectorSelection}>
                                                        <td class={seq.vectorCellClass} onclick={stopProp}>
                                                            <div class="step3-vector-cell">
                                                                <template if:true={seq.hasMissingVector}>
                                                                    <lightning-icon icon-name="utility:warning"
                                                                        size="x-small" alternative-text="Warning"
                                                                        class="sequence-warning-icon"></lightning-icon>
                                                                </template>
                                                                <c-abt-custom-select
                                                                    class="step3-inline-select step3-vector-select"
                                                                    size="sm" name="vector" placeholder="Default vector"
                                                                    options={vectorOptions} value={seq.vector}
                                                                    data-id={seq.id} disabled={isReadOnly}
                                                                    onchange={handleRowVectorChange}></c-abt-custom-select>
                                                                <c-abt-reflex-vector-opt-in data-id={seq.id}
                                                                    show-icon={seq.showReflexOptIn}
                                                                    opted-in={seq.reflexVectorOptIn}
                                                                    is-open={seq.reflexPopoverOpen}
                                                                    disabled={isReadOnly} ontoggle={handleReflexToggle}
                                                                    onsave={handleReflexSave}></c-abt-reflex-vector-opt-in>
                                                            </div>
                                                        </td>
                                                    </template>
                                                    <td class="step3-td step3-td-feasibility">{seq.feasibility}</td>
                                                    <td class="step3-td step3-td-toxic" onclick={stopProp}>
                                                        <input type="checkbox" data-id={seq.id}
                                                            checked={seq.potentiallyToxic} onchange={handleToxicChange}
                                                            disabled={isReadOnly} />
                                                    </td>
                                                    <td class="step3-td step3-td-icon" onclick={handleDeleteSequence}
                                                        data-id={seq.id}>
                                                        <template if:true={canEdit}>
                                                            <template if:true={seq.isDeleting}>
                                                                <span class="step3-row-loading" role="status"
                                                                    aria-live="polite" aria-label="Deleting sequence">
                                                                    <span class="dot-loading" aria-hidden="true">
                                                                        <span class="dot dot1"></span>
                                                                        <span class="dot dot2"></span>
                                                                        <span class="dot dot3"></span>
                                                                    </span>
                                                                </span>
                                                            </template>
                                                            <template if:false={seq.isDeleting}>
                                                                <c-abt-delete-icon size="sm" alternative-text="Delete"
                                                                    class="step3-delete-icon"></c-abt-delete-icon>
                                                            </template>
                                                        </template>
                                                    </td>
                                                </tr>
                                            </template>
                                        <template if:true={showDraftRows}>
                                            <template for:each={draftRowsWithDisplay} for:item="draft">
                                                <tr key={draft.id} class={draft.rowClass} data-id={draft.id}
                                                    onclick={stopProp}>
                                                    <td class="step3-td step3-td-check" onclick={stopProp}>
                                                        <input type="checkbox" disabled />
                                                    </td>
                                                    <td class="step3-td step3-td-name" onclick={stopProp}>
                                                        <div class="step3-name-cell step3-name-cell--draft">
                                                            <template if:true={draft.hasInvalidName}>
                                                                <lightning-icon icon-name="utility:warning"
                                                                    size="x-small" alternative-text="Warning"
                                                                    class="sequence-warning-icon"></lightning-icon>
                                                            </template>
                                                            <input type="text" class={draft.nameInputClass}
                                                                data-id={draft.id} data-field="name" value={draft.name}
                                                                maxlength={sequenceNameMaxLength}
                                                                placeholder="Enter Name"
                                                                aria-label="Sequence name"
                                                                disabled={draft.isSaving}
                                                                oninput={handleDraftNameInput}
                                                                onblur={handleDraftBlur} onpaste={handleDraftPaste}
                                                                title={draft.nameTooltip} />
                                                        </div>
                                                    </td>
                                                    <td class="step3-td step3-td-seq" onclick={stopProp}>
                                                        <div class="step3-draft-seq-cell">
                                                            <template if:true={draft.hasInvalidChars}>
                                                                <lightning-icon icon-name="utility:warning"
                                                                    size="x-small" alternative-text="Warning"
                                                                    class="sequence-warning-icon"></lightning-icon>
                                                            </template>
                                                            <input type="text" class={draft.sequenceInputClass}
                                                                data-id={draft.id} data-field="sequence"
                                                                value={draft.sequence}
                                                                placeholder="Enter Sequence"
                                                                aria-label="Sequence"
                                                                disabled={draft.isSaving}
                                                                oninput={handleDraftSequenceInput}
                                                                onblur={handleDraftBlur} onpaste={handleDraftPaste}
                                                                title={draft.sequenceTooltip} />
                                                        </div>
                                                    </td>
                                                    <td class="step3-td step3-td-num">{draft.lengthDisplay}</td>
                                                    <template if:true={showVectorSelection}>
                                                        <td class="step3-td step3-td-vector" onclick={stopProp}>
                                                            <div class="step3-vector-cell">
                                                                <template if:true={draft.hasMissingVector}>
                                                                    <lightning-icon icon-name="utility:warning"
                                                                        size="x-small" alternative-text="Warning"
                                                                        class="sequence-warning-icon"></lightning-icon>
                                                                </template>
                                                                <c-abt-custom-select
                                                                    class="step3-inline-select step3-vector-select"
                                                                    size="sm" name="draft-vector"
                                                                    placeholder="Default vector"
                                                                    options={vectorOptions} value={draft.vector}
                                                                    data-id={draft.id} disabled={draft.isSaving}
                                                                    onchange={handleDraftVectorChange}></c-abt-custom-select>
                                                                <span class="step3-vector-reflex-slot"
                                                                    aria-hidden="true"></span>
                                                            </div>
                                                        </td>
                                                    </template>
                                                    <td class="step3-td step3-td-feasibility"></td>
                                                    <td class="step3-td step3-td-toxic" onclick={stopProp}>
                                                        <input type="checkbox" data-id={draft.id}
                                                            checked={draft.potentiallyToxic}
                                                            disabled={draft.isSaving}
                                                            onchange={handleDraftToxicChange} />
                                                    </td>
                                                    <td class="step3-td step3-td-icon">
                                                        <template if:true={draft.isSaving}>
                                                            <span class="step3-row-loading" role="status"
                                                                aria-live="polite" aria-label="Saving sequence">
                                                                <span class="dot-loading" aria-hidden="true">
                                                                    <span class="dot dot1"></span>
                                                                    <span class="dot dot2"></span>
                                                                    <span class="dot dot3"></span>
                                                                </span>
                                                            </span>
                                                        </template>
                                                    </td>
                                                </tr>
                                            </template>
                                        </template>
                                        <template if:true={showEmptySequencesMessage}>
                                            <tr>
                                                <td colspan={step3Colspan} class="step3-empty">No sequences on this
                                                    quote yet.</td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>

                            <div class="quote-detail-footer">
                                <button type="button" class="quote-download-link" onclick={handleDownloadSequences}>
                                    <c-abt-download-icon size="md" alternative-text="Download"></c-abt-download-icon>
                                    DOWNLOAD SEQUENCES
                                </button>
                                <div class="quote-detail-footer-totals step4-totals">
                                    <template if:true={showScaleUpSelection}>
                                        <span class="step4-total-item">Scale Up Fee: <b>{totalScaleUpFee}</b></span>
                                    </template>
                                    <template if:true={showGlycerolSelection}>
                                        <span class="step4-total-item step4-total-item--glycerol">Glycerol Stock Fee:
                                            <b>{totalGlycerolFeeDisplay}</b></span>
                                    </template>
                                    <span class="step4-grand-total">TOTAL: <b>{grandTotal}</b></span>
                                </div>
                            </div>
                            <template if:true={showFooterActions}>
                                <div class="quote-detail-footer-action">
                                    <template if:true={canDeleteQuote}>
                                        <button type="button" class="quote-delete-btn" onclick={handleDeleteQuoteClick}
                                            disabled={isDeleteQuoteDisabled}>{deleteQuoteLabel}</button>
                                    </template>
                                    <template if:true={showCartAction}>
                                        <button type="button" class="quote-cart-btn" onclick={handleCartAction}
                                            disabled={isCartActionDisabled}>
                                            {cartActionLabelProcessing}
                                        </button>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- ─── DELIVERY DETAILS TAB ──────────────────────────────────────── -->
                    <template if:true={isDeliveryTab}>
                        <div class="quote-body step4-body">
                            <div class={step4TableWrapClass}>
                                <table class={step4TableClass}>
                                    <thead>
                                        <tr>
                                            <th class="step3-th step3-th-check">
                                                <input type="checkbox" checked={allSequencesSelected} onclick={stopProp}
                                                    onchange={handleSelectAll} disabled={isReadOnly} />
                                            </th>
                                            <th class="step3-th step3-th-name">Name</th>
                                            <th class="step3-th step3-th-date step3-th-tooltip">
                                                <c-abt-table-header-tooltip label="As Early As Date">
                                                    <p>Your order could ship as early as this date — actual timing may
                                                        vary.</p>
                                                </c-abt-table-header-tooltip>
                                            </th>
                                            <th class="step3-th step3-th-date step3-th-tooltip">
                                                <c-abt-table-header-tooltip label="Guaranteed Date" wide="true">
                                                    <p><strong>Guaranteed orders:</strong> your committed ship date,
                                                        backed by Ansa's on-time guarantee promise.</p>
                                                    <p><strong>Let's Try orders:</strong> your estimated ship date.</p>
                                                </c-abt-table-header-tooltip>
                                            </th>
                                            <th class="step3-th step3-th-group step3-th-tooltip">
                                                <c-abt-table-header-tooltip label="Tranche">
                                                    <p>For large orders, Ansa may split your sequences into separate
                                                        shipment groups called tranches — each with its own estimated
                                                        ship date so you can receive completed sequences sooner.</p>
                                                </c-abt-table-header-tooltip>
                                            </th>
                                            <th class="step3-th step3-th-complexity step3-th-tooltip">
                                                <span class="quote-th-tooltip-wrap" tabindex="0">
                                                    <span class="quote-th-tooltip-label">Complexity</span>
                                                    <span
                                                        class="quote-th-tooltip-popover quote-th-tooltip-popover--wide"
                                                        role="tooltip">
                                                        <span class="quote-th-tooltip-arrow" aria-hidden="true"></span>
                                                        <span class="quote-th-tooltip-body">
                                                            <p>This assessment reflects sequence characteristics that
                                                                increase
                                                                synthesis and assembly difficulty.</p>
                                                            <p><strong>Standard:</strong> Readily manufacturable
                                                                sequence with low
                                                                complexity.</p>
                                                            <p><strong>Complex:</strong> Sequence exhibits moderate to
                                                                high
                                                                complexity.</p>
                                                        </span>
                                                    </span>
                                                </span>
                                            </th>
                                            <template if:true={showGlycerolSelection}>
                                                <th class="step3-th step3-th-glycerol step3-th-tooltip">
                                                    <c-abt-table-header-tooltip label="Glycerol Stock">
                                                        <p>Includes a glycerol stock shipped on dry ice alongside your
                                                            dried down sample — ideal for long-term storage.</p>
                                                    </c-abt-table-header-tooltip>
                                                </th>
                                            </template>
                                            <template if:true={showScaleUpSelection}>
                                                <th class="step3-th step3-th-scaleup step3-th-tooltip">
                                                    <c-abt-table-header-tooltip label="Scale Up">
                                                        <p>Add a scale-up prep to this sequence. Select the checkbox,
