<template>
    <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="abt-modal-heading"
        class="slds-modal slds-fade-in-open abt-modal">
        <div class="slds-modal__container">
            <header class="slds-modal__header">
                <h2 class="slds-modal__title slds-hyphenate" id="abt-modal-heading">{title}</h2>
                <button type="button"
                    class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                    title="Close" onclick={handleClose}>
                    <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                </button>
            </header>
            <div class="slds-modal__content slds-p-around_medium">
                <slot></slot>
            </div>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
