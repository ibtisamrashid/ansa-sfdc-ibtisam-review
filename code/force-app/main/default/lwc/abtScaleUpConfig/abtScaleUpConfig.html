    <template if:true={isOpen}>
      <div
        class="scaleup-popover"
        onclick={stopProp}
        role="dialog"
        aria-label="Scale up configuration"
      >
        <span class="scaleup-popover-arrow" aria-hidden="true"></span>

        <p class="scaleup-early-access">{earlyAccessMessage}</p>

        <div class="scaleup-header-row">
          <div class={quantityFieldClass}>
            <span class="scaleup-label">Prep Quantity:</span>
            <c-abt-custom-select
              class="scaleup-select scaleup-select--quantity"
              name="scaleup-quantity"
              size="md"
              placeholder="0"
              options={quantitySelectOptions}
              value={draftQuantity}
              disabled={disabled}
              onchange={handleQuantityChange}
            ></c-abt-custom-select>
          </div>
          <button
            type="button"
            class="scaleup-definitions-link"
            onclick={handleDefinitionsClick}
          >
            <span>Scale Up Definitions</span>
            <svg
              class="scaleup-definitions-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <circle
                cx="12"
                cy="12"
                r="10"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              />
              <path
                d="M12 10.5v5.5M12 8.25h.01"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>

        <div class="scaleup-body">
          <div class="scaleup-row-field scaleup-body-cell">
            <span class="scaleup-label">Copy Number:</span>
            <span class="scaleup-copy-number-value">{copyNumberDisplay}</span>
          </div>
          <div class="scaleup-row-field scaleup-body-cell">
            <span class="scaleup-label">Buffer:</span>
            <c-abt-custom-select
              class="scaleup-select"
              name="scaleup-buffer"
              size="md"
              placeholder="Select..."
              options={bufferSelectOptions}
              value={draftBuffer}
              disabled={disabled}
              onchange={handleBufferChange}
            ></c-abt-custom-select>
          </div>
        
          <label class="scaleup-checkbox-row scaleup-body-cell">
            <input
              type="checkbox"
              class="abt-checkbox-native"
              checked={draftEndotoxinFree}
              onchange={handleEndotoxinFreeChange}
              disabled={disabled}
            />
            <span class="scaleup-check-text">Endotoxin Free</span>
          </label>
          <div class="scaleup-row-field scaleup-body-cell">
            <span class="scaleup-label">Normalization:</span>
            <c-abt-custom-select
              class="scaleup-select"
              name="scaleup-normalization"
              size="md"
              placeholder="Select..."
              options={normalizationSelectOptions}
              value={draftNormalization}
              disabled={disabled}
              onchange={handleNormalizationChange}
            ></c-abt-custom-select>
          </div>
        
          <label class="scaleup-checkbox-row scaleup-body-cell">
            <input
              type="checkbox"
              class="abt-checkbox-native"
              checked={draftGlycerol}
              onchange={handleGlycerolChange}
              disabled={disabled}
            />
            <span class="scaleup-check-text">Glycerol Stock</span>
          </label>
          <template if:true={showApplyCheckbox}>
            <label class="scaleup-checkbox-row scaleup-body-cell scaleup-checkbox-row--apply">
              <input
                type="checkbox"
                class="abt-checkbox-native"
                checked={draftApplyToSelected}
                onchange={handleApplyToSelectedChange}
                disabled={disabled}
              />
              <span class="scaleup-check-text">{applyCheckboxLabel}</span>
            </label>
          </template>
          <template if:false={showApplyCheckbox}>
            <div class="scaleup-body-cell" aria-hidden="true"></div>
          </template>
        </div>

        <template if:true={showQuantityError}>
          <span class="scaleup-field-error">Prep Quantity is required.</span>
        </template>

        

        <div class="scaleup-actions-row">
          <button
            type="button"
            class="scaleup-popover-cancel"
            onclick={handleCancel}
            disabled={isActionsDisabled}
          >
            Cancel
          </button>
          <button
            type="button"
            class="scaleup-popover-apply"
            onclick={handleApply}
            disabled={isActionsDisabled}
          >
            <template if:true={saving}>Processing...</template>
            <template if:false={saving}>Apply</template>
          </button>
        </div>

        <div class="scaleup-footer-row">
          <div class="scaleup-footer-stat">
            <span class="scaleup-footer-label">Expected Yield:</span>
            <strong class="scaleup-footer-value">{massDisplay}</strong>
          </div>
          <div class="scaleup-footer-stat">
            <span class="scaleup-footer-label">Scale Up Price:</span>
            <strong class="scaleup-footer-value">{priceDisplay}</strong>
          </div>
        </div>
      </div>
    </template>
  </div>
</template>
